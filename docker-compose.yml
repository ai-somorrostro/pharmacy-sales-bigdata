name: pharmacy-bigdata

services:
  influxdb:
    image: influxdb:${INFLUXDB_VERSION:?define INFLUXDB_VERSION en .env}
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET_DAILY}
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN}
      INFLUX_BUCKET_MONTHLY: ${INFLUX_BUCKET_MONTHLY}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./BDA/influxdb/init-buckets.sh:/docker-entrypoint-initdb.d/init-buckets.sh:ro
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:?define GRAFANA_VERSION en .env}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
       - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Variables que lee el aprovisionamiento del datasource
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET_DAILY: ${INFLUX_BUCKET_DAILY}
      INFLUX_READ_TOKEN: ${INFLUX_READ_TOKEN}
      # Email para alertas
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_USER}
      GF_SMTP_FROM_NAME: Grafana Farmacias
    volumes:
      - grafana-data:/var/lib/grafana
      - ./BDA/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./BDA/grafana/dashboards:/var/lib/grafana/dashboards:ro
  nodered:
    build:
      context: ./BDA/nodered
      args:
        NODERED_VERSION: ${NODERED_VERSION:?define NODERED_VERSION en .env}
        INFLUX_NODE_VERSION: ${NODERED_INFLUX_NODE_VERSION:?define NODERED_INFLUX_NODE_VERSION en .env}
    container_name: nodered
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    # init-flows.sh inyecta INFLUX_WRITE_TOKEN en el nodo de InfluxDB
    # y luego arranca el entrypoint original de Node-RED
    entrypoint: ["/bin/sh", "/opt/init-flows.sh"]
    ports:
      - "127.0.0.1:1881:1880"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET_DAILY: ${INFLUX_BUCKET_DAILY}
      INFLUX_BUCKET_MONTHLY: ${INFLUX_BUCKET_MONTHLY}
      INFLUX_WRITE_TOKEN: ${INFLUX_WRITE_TOKEN}
    volumes:
      - nodered-data:/data
      # CSV generados con el notebook; en los flujos se leen desde /csv
      - ${DATA_DIR:-./BDA}:/csv:ro



  mcp-grafana:
    image: grafana/mcp-grafana:${GRAFANA_MCP_VERSION:?define GRAFANA_MCP_VERSION en .env}
    container_name: mcp-grafana
    restart: unless-stopped
    depends_on:
      - grafana
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_MCP_TOKEN:?define GRAFANA_MCP_TOKEN en .env}
      # Token que deben presentar los clientes MCP (opencode.json) al
      # llamar a /mcp. Es distinto del service account token: este
      # autentica al cliente frente al servidor MCP.
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN:?define MCP_GRAFANA_SERVER_TOKEN en .env}
    command:
      - --transport
      - streamable-http
      - --address
      - ":8000"
      - --disable-write
    ports:
      - "127.0.0.1:${GRAFANA_MCP_PORT:-8000}:8000"


volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  nodered-data:
